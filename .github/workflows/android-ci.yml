name: Android CI & Distribute

on:
  push:
    branches: [ main, develop ] # Distribute only on pushes to the main branch
  # pull_request:
  #   branches: [ main, develop ] # Keep PR builds if needed, but they won't distribute

jobs:
  build_and_distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decode google-services.json (Linux)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "Creating google-services.json for Linux runner"
          FILE_PATH="app/google-services.json"
          mkdir -p "$(dirname "$FILE_PATH")"
          echo "Writing google-services.json to $FILE_PATH"
          echo $GOOGLE_SERVICES_JSON_BASE64 | base64 --decode > $FILE_PATH
          echo "google-services.json created successfully."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests for Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew :app:testReleaseUnitTest

      - name: Run unit tests for Debug
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: ./gradlew :app:testDebugUnitTest

      # Steps for building and distributing the Release version (runs on push to main)
      - name: Build Release AAB
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew :app:bundleRelease

      - name: Build Debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: ./gradlew :app:assembleDebug

      - name: Decode Firebase Service Account Key
        id: decode_sa_key
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.FIREBASE_APP_DISTRO_SERVICE_ACCOUNT_BASE64 }}
        run: |
          echo "Decoding Firebase service account key..."
          SERVICE_ACCOUNT_FILE_PATH="${{ runner.temp }}/firebase_service_account.json"
          echo "Attempting to decode to: $SERVICE_ACCOUNT_FILE_PATH"
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY_BASE64" | base64 --decode > "$SERVICE_ACCOUNT_FILE_PATH"
          
          echo "Verifying file existence and content: $SERVICE_ACCOUNT_FILE_PATH"
          if [ -s "$SERVICE_ACCOUNT_FILE_PATH" ]; then
            echo "Service account JSON file created and is not empty."
            ls -l "$SERVICE_ACCOUNT_FILE_PATH"
            # Set output for subsequent steps
            echo "::set-output name=sa_file_path::$SERVICE_ACCOUNT_FILE_PATH"
          else
            echo "ERROR: Service account JSON file is empty or was not created at $SERVICE_ACCOUNT_FILE_PATH." >&2
            exit 1 # Fail the step if the file is empty or not created
          fi

      - name: Upload to Firebase App Distribution (Release)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew :app:appDistributionUploadRelease -Pcomiqueta.ci.serviceCredentialsFile=${{ steps.decode_sa_key.outputs.sa_file_path }}

      - name: Upload to Firebase App Distribution (Debug)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: ./gradlew :app:appDistributionUploadDebug -Pcomiqueta.ci.serviceCredentialsFile=${{ steps.decode_sa_key.outputs.sa_file_path }}

    # Optional: Upload build artifacts (e.g., AAB/APK) to GitHub for archival
    # - name: Upload Release AAB Artifact
    #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: app-release-aab
    #     path: app/build/outputs/bundle/release/*.aab # Adjust path as needed
