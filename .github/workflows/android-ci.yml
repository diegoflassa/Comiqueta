name: Android CI & Distribute

on:
  push:
    branches: [ main, develop ] # Distribute only on pushes to the main branch
  # pull_request:
  #   branches: [ main, develop ] # Keep PR builds if needed, but they won't distribute

jobs:
  build_and_distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decode google-services.json (Linux)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "Creating google-services.json for Linux runner"
          FILE_PATH="app/google-services.json"
          mkdir -p "$(dirname "$FILE_PATH")"
          echo $GOOGLE_SERVICES_JSON_BASE64 | base64 --decode > $FILE_PATH
          echo "google-services.json created successfully."

      - name: Decode firebase_app_distribution.properties
        env:
          FIREBASE_APP_DISTRO_PROPERTIES_BASE64: ${{ secrets.FIREBASE_APP_DISTRIBUTION_PROPERTIES_BASE64 }}
        run: |
          echo "Attempting to create firebase_app_distribution.properties..."
          PROPERTIES_FILE_PATH="app/firebase_app_distribution.properties"
          if [ -n "$FIREBASE_APP_DISTRO_PROPERTIES_BASE64" ]; then
            mkdir -p "$(dirname "$PROPERTIES_FILE_PATH")" # Ensure app directory exists
            echo "$FIREBASE_APP_DISTRO_PROPERTIES_BASE64" | base64 --decode > "$PROPERTIES_FILE_PATH"
            echo "firebase_app_distribution.properties created successfully at $PROPERTIES_FILE_PATH."
            echo "Content of firebase_app_distribution.properties:"
            cat "$PROPERTIES_FILE_PATH"
          else
            echo "Warning: FIREBASE_APP_DISTRIBUTION_PROPERTIES_BASE64 secret is not set or is empty. Skipping creation of firebase_app_distribution.properties."
          fi

      - name: Decode Firebase Service Account Key
        id: decode_sa_key
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.FIREBASE_APP_DISTRO_SERVICE_ACCOUNT_BASE64 }}
        run: |
          echo "Decoding Firebase service account key..."
          TEMP_SERVICE_ACCOUNT_FILE_PATH="${{ runner.temp }}/firebase_service_account.json"
          WORKSPACE_RELATIVE_PATH="firebase_service_account_for_ci.json" # File name in workspace
          ABSOLUTE_SERVICE_ACCOUNT_FILE_PATH="${{ github.workspace }}/$WORKSPACE_RELATIVE_PATH"

          echo "Attempting to decode to temporary file: $TEMP_SERVICE_ACCOUNT_FILE_PATH"
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY_BASE64" | base64 --decode > "$TEMP_SERVICE_ACCOUNT_FILE_PATH"
          
          echo "Verifying temporary file: $TEMP_SERVICE_ACCOUNT_FILE_PATH"
          if [ -s "$TEMP_SERVICE_ACCOUNT_FILE_PATH" ]; then
            echo "Temporary service account JSON file created and is not empty."
            ls -l "$TEMP_SERVICE_ACCOUNT_FILE_PATH"
            
            echo "Copying temporary file to workspace at: $ABSOLUTE_SERVICE_ACCOUNT_FILE_PATH"
            cp "$TEMP_SERVICE_ACCOUNT_FILE_PATH" "$ABSOLUTE_SERVICE_ACCOUNT_FILE_PATH"
            
            echo "Verifying workspace file: $ABSOLUTE_SERVICE_ACCOUNT_FILE_PATH"
            if [ -s "$ABSOLUTE_SERVICE_ACCOUNT_FILE_PATH" ]; then
              echo "Workspace service account JSON file copied and is not empty."
              ls -l "$ABSOLUTE_SERVICE_ACCOUNT_FILE_PATH"
              # THIS IS THE CRUCIAL LINE TO PRINT THE CONTENT:
              echo "Full content of decoded service account file ($ABSOLUTE_SERVICE_ACCOUNT_FILE_PATH):"
              cat "$ABSOLUTE_SERVICE_ACCOUNT_FILE_PATH"
              echo "\nEnd of service account file content."
              echo "::set-output name=sa_file_path::$ABSOLUTE_SERVICE_ACCOUNT_FILE_PATH"
              echo "Step output sa_file_path set to: $ABSOLUTE_SERVICE_ACCOUNT_FILE_PATH"
            else
              echo "ERROR: Failed to copy or workspace service account file is empty at $ABSOLUTE_SERVICE_ACCOUNT_FILE_PATH." >&2
              exit 1
            fi
          else
            echo "ERROR: Temporary service account JSON file is empty or was not created at $TEMP_SERVICE_ACCOUNT_FILE_PATH." >&2
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests for Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew :app:testReleaseUnitTest

      - name: Run unit tests for Debug
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: ./gradlew :app:testDebugUnitTest

      - name: Build Release AAB
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew :app:bundleRelease

      - name: Build Debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: ./gradlew :app:assembleDebug

      - name: Pre-Upload - Verify Service Account File
        run: |
          echo "Verifying service account file existence and permissions before upload attempt..."
          ls -l "${{ steps.decode_sa_key.outputs.sa_file_path }}"
          echo "Path to be used by GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.decode_sa_key.outputs.sa_file_path }}"
          if [ ! -f "${{ steps.decode_sa_key.outputs.sa_file_path }}" ]; then
            echo "ERROR: Service account file NOT FOUND at ${{ steps.decode_sa_key.outputs.sa_file_path }} just before upload!" >&2
            exit 1
          fi
          echo "Service account file confirmed to exist at ${{ steps.decode_sa_key.outputs.sa_file_path }}"

      - name: Upload to Firebase App Distribution (Release)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.decode_sa_key.outputs.sa_file_path }}
        run: ./gradlew :app:appDistributionUploadRelease --stacktrace --scan

      - name: Upload to Firebase App Distribution (Debug)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.decode_sa_key.outputs.sa_file_path }}
        run: ./gradlew :app:appDistributionUploadDebug --stacktrace --scan

    # Optional: Upload build artifacts (e.g., AAB/APK) to GitHub for archival
    # - name: Upload Release AAB Artifact
    #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: app-release-aab
    #     path: app/build/outputs/bundle/release/*.aab # Adjust path as needed
