#Mon Jul 07 23:52:05 BRT 2025

#Android
android.dependency.useConstraints=true
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
android.experimental.enableNewResourceShrinker.preciseShrinking=true
android.nonTransitiveRClass=true
android.r8.strictFullModeForKeepRules=false
android.disallowKotlinSourceSets=false
android.useAndroidX=true

#Kotlin
kotlin.code.style=official

#Gradle
org.gradle.configuration-cache=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx6144M -Dkotlin.daemon.jvm.options="-Xmx3072M" -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:+DisableExplicitGC -XX:MaxGCPauseMillis=200
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true
